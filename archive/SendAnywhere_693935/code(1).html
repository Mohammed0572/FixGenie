<!DOCTYPE html>

<style>
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      }
      .glass-panel {
        background: rgba(255, 255, 255, 0.8);
        backdrop-filter: blur(12px);
      }
      .dark .glass-panel {
        background: rgba(25, 28, 30, 0.8);
      }
    </style>
</head>
<body class="bg-surface-container-low dark:bg-inverse-surface min-h-screen flex flex-col font-body transition-colors duration-300">
<!-- Theme Toggle (Glassmorphic Pill) -->
<div class="fixed top-6 right-6 z-50">
<button class="glass-panel px-4 py-2 rounded-full flex items-center gap-2 text-on-surface-variant hover:bg-surface-container-high transition-all shadow-sm" onclick="document.documentElement.classList.toggle('dark')">
<span class="material-symbols-outlined text-[20px]">dark_mode</span>
<span class="text-xs font-bold font-label uppercase tracking-wider">Toggle Theme</span>
</button>
</div>
<!-- Main Content Container -->
<main class="flex-grow flex items-center justify-center p-6 md:p-24">
<!-- Login Card -->
<div class="w-full max-w-[480px] animate-in fade-in slide-in-from-bottom-4 duration-700">
<!-- Logo/Brand Anchor (Editorial Precision) -->
<div class="text-center mb-10">
<div class="inline-flex items-center justify-center p-3 rounded-xl bg-primary/10 dark:bg-primary/20 mb-4">
<span class="material-symbols-outlined text-primary text-4xl" style="font-variation-settings: 'FILL' 1;">psychology</span>
</div>
<h1 class="font-headline text-3xl font-extrabold tracking-tighter text-on-surface mb-2">Triage AI</h1>
<p class="font-body text-on-surface-variant text-sm">Editorial precision for AI-driven bug triage.</p>
</div>
<!-- Authentic Surface Layering -->
<div class="bg-surface-container-lowest dark:bg-surface-dim rounded-xl shadow-[0_10px_40px_-10px_rgba(0,101,145,0.08)] overflow-hidden">
<!-- Tabs -->
<div class="flex border-b border-outline-variant/15">
<button class="flex-1 py-4 text-sm font-bold font-label text-primary border-b-2 border-primary">Sign In</button>
<button class="flex-1 py-4 text-sm font-medium font-label text-on-surface-variant hover:bg-surface-container-low transition-colors">Sign Up</button>
</div>
<div class="p-8 md:p-10">
<form class="space-y-6">
<!-- Email Input -->
<div>
<label class="block text-xs font-bold font-label uppercase tracking-[0.05em] text-on-surface-variant mb-2">Email Address</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline group-focus-within:text-primary transition-colors">mail</span>
<input class="w-full pl-12 pr-4 py-3 bg-surface-container dark:bg-surface-container-high border-none rounded-xl focus:ring-2 focus:ring-primary/20 text-on-surface placeholder:text-outline transition-all" placeholder="name@company.com" type="email"/>
</div>
</div>
<!-- Password Input -->
<div>
<div class="flex justify-between items-center mb-2">
<label class="block text-xs font-bold font-label uppercase tracking-[0.05em] text-on-surface-variant">Password</label>
<a class="text-[11px] font-bold text-primary hover:underline uppercase tracking-wider" href="#">Forgot Password?</a>
</div>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline group-focus-within:text-primary transition-colors">lock</span>
<input class="w-full pl-12 pr-12 py-3 bg-surface-container dark:bg-surface-container-high border-none rounded-xl focus:ring-2 focus:ring-primary/20 text-on-surface placeholder:text-outline transition-all" placeholder="••••••••" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-outline hover:text-on-surface transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]">visibility</span>
</button>
</div>
</div>
<!-- Submit Button (Primary Gradient) -->
<button class="w-full py-4 bg-gradient-to-r from-primary to-primary-container text-on-primary font-headline font-bold rounded-xl shadow-lg shadow-primary/20 hover:scale-[0.98] transition-transform duration-200 active:scale-95" type="submit">
                            Secure Log In
                        </button>
</form>
<!-- Divider -->
<div class="relative my-8">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-outline-variant/20"></div>
</div>
<div class="relative flex justify-center text-xs uppercase tracking-widest font-bold">
<span class="bg-surface-container-lowest dark:bg-surface-dim px-4 text-outline">or continue with</span>
</div>
</div>
<!-- Social Logins -->
<div class="grid grid-cols-2 gap-4">
<button class="flex items-center justify-center gap-3 py-3 px-4 rounded-xl bg-surface-container-low hover:bg-surface-container-high transition-colors text-on-surface-variant font-label text-sm border border-outline-variant/10">
<img alt="Google" class="w-5 h-5" data-alt="clean minimal google logo icon on transparent background" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAOKc4zs59_ugYkCRS1zfNEMC3xyEhrUuXV8d0D9Hq5eyfjzLXzeEWeaLDFOu3VHJh6EOADm1Q7JH6dJTyWghrfURG_KKO1w5zrbmRsn4p4a59HewhCCCe0-VVnCpUK3V-XC7EMnm2xIuULAp2_9oWmYg3VAM5MynWo47G2QbJC55s7PFPWqOKK96ou2dvbrOoekUcvo6BUelwU6BuXp3INT5qRvyGEZwPwjhdgOAr4tMu-ld7huPZHBYgEf6d0NvHrUT2bGeK018M"/>
<span>Google</span>
</button>
<button class="flex items-center justify-center gap-3 py-3 px-4 rounded-xl bg-surface-container-low hover:bg-surface-container-high transition-colors text-on-surface-variant font-label text-sm border border-outline-variant/10">
<span class="material-symbols-outlined text-on-surface">terminal</span>
<span>GitHub</span>
</button>
</div>
</div>
</div>
<!-- Footer Meta -->
<p class="text-center mt-8 text-[11px] font-medium font-label text-on-surface-variant uppercase tracking-widest leading-loose">
                v2.4 Powered by Machine Learning<br/>
                © 2024 Triage AI Systems Inc.
            </p>
</div>
</main>
<!-- Side Graphic (Decorative AI Triage Visualization) -->
<div class="hidden lg:block fixed left-12 bottom-12 max-w-xs opacity-40 mix-blend-multiply dark:mix-blend-screen pointer-events-none">
<div class="relative">
<div class="absolute -inset-4 bg-primary/20 blur-3xl rounded-full"></div>
<div class="relative p-6 glass-panel rounded-xl border border-white/20">
<div class="flex items-center gap-3 mb-4">
<span class="w-2 h-2 rounded-full bg-error animate-pulse"></span>
<span class="text-[10px] font-bold uppercase tracking-tighter text-on-surface-variant">Live Analysis: Active Bugs (142)</span>
</div>
<div class="space-y-2">
<div class="h-1.5 w-full bg-surface-container rounded-full overflow-hidden">
<div class="h-full bg-primary w-[70%]"></div>
</div>
<div class="h-1.5 w-full bg-surface-container rounded-full overflow-hidden">
<div class="h-full bg-tertiary-container w-[45%]"></div>
</div>
</div>
</div>
</div>
</div>
